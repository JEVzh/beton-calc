<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a252f">
    <title>Калькулятор бетона</title>
    
    <!-- Ссылка на манифест -->
    <link rel="manifest" href="manifest.json">
    <!-- Иконка для Apple -->
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a252f; color: #ecf0f1; padding: 12px; }
        .header { background: linear-gradient(90deg, #c0392b, #2980b9); padding: 12px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 12px; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 12px; }
        .mode-btn { flex: 1; padding: 10px; background: #2c3e50; border: 2px solid #34495e; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .mode-btn.active { background: #27ae60; border-color: #2ecc71; }
        .input-group { background: #243342; border: 2px solid #34495e; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .input-row { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .input-label { flex: 1; font-size: 12px; font-weight: bold; }
        select, input { width: 160px; padding: 8px; border-radius: 8px; border: 2px solid #3498db; font-weight: bold; }
        .results { background: #243342; border: 2px solid #34495e; border-radius: 10px; padding: 12px; }
        .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .card { background: #2c3e50; border: 2px solid #3498db; border-radius: 10px; padding: 8px; text-align: center; }
        .card-value { font-size: 20px; font-weight: bold; margin: 4px 0; }
        .card-sub { color: #95a5a6; font-size: 10px; }
        .total-card { grid-column: 1 / -1; border-color: #2ecc71; }
        .total-card .card-value { color: #2ecc71; }
    </style>
</head>
<body>
    <div class="header">КАЛЬКУЛЯТОР БЕТОНА</div>
    <div class="mode-toggle">
        <button class="mode-btn active" id="mode-std" onclick="setMode('std')">Стандарт</button>
        <button class="mode-btn" id="mode-pgs" onclick="setMode('pgs')">ПЩС</button>
    </div>
    <div class="input-group">
        <div class="input-row">
            <label class="input-label">Цемент:</label>
            <select id="cement" onchange="updateMixes()">
                <option value="expert500">ЭКСПЕРТ 500</option>
                <option value="profi450">ПРОФИ 450</option>
            </select>
        </div>
        <div class="input-row">
            <label class="input-label">Смесь:</label>
            <select id="mix" onchange="calculate()"></select>
        </div>
        <div class="input-row">
            <label class="input-label">Объём (л):</label>
            <input type="number" id="volume" value="50" oninput="calculate()">
        </div>
        <div class="input-row">
            <label class="input-label">Ведро (л):</label>
            <input type="number" id="bucket" value="10" oninput="calculate()">
        </div>
    </div>
    <div class="results">
        <div class="cards-grid" id="cards"></div>
    </div>

    <script>
        // Регистрация Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW зарегистрирован:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Ошибка регистрации SW:', error);
                    });
            });
        }

        const RECIPES = {
            expert500: { 'М150': {g:0, s:17, w:4, d:2.2}, 'М200': {g:14, s:11, w:4, d:2.35}, 'М300': {g:12, s:9, w:3, d:2.35}, 'М400': {g:9, s:7, w:2.5, d:2.4} },
            profi450: { 'М150': {g:0, s:16, w:4, d:2.2}, 'М200': {g:12, s:9, w:4, d:2.35}, 'М300': {g:10, s:8, w:3, d:2.35}, 'М400': {g:8, s:6, w:2.5, d:2.4} }
        };
        let mode = 'std';

        function setMode(m) {
            mode = m;
            document.getElementById('mode-std').className = m==='std' ? 'mode-btn active' : 'mode-btn';
            document.getElementById('mode-pgs').className = m==='pgs' ? 'mode-btn active' : 'mode-btn';
            calculate();
        }

        function updateMixes() {
            const c = document.getElementById('cement').value;
            const sel = document.getElementById('mix');
            sel.innerHTML = '';
            for(let k in RECIPES[c]) {
                let o = document.createElement('option');
                o.value = k; o.text = k;
                sel.add(o);
            }
            calculate();
        }

        function calculate() {
            const cKey = document.getElementById('cement').value;
            const mKey = document.getElementById('mix').value;
            const r = RECIPES[cKey][mKey];
            const vol = parseFloat(document.getElementById('volume').value) || 0;
            const bkt = parseFloat(document.getElementById('bucket').value) || 10;
            
            if(!vol) return;

            const scale = vol / 50; 
            const cem = (50 / 1.3 / bkt * scale).toFixed(1);
            const sand = (r.s * scale).toFixed(1);
            const grav = (r.g * scale).toFixed(1);
            const water = (r.w * scale).toFixed(1);

            let html = `
                <div class="card"><div>ЦЕМЕНТ</div><div class="card-value" style="color:#e74c3c">${cem} вед.</div></div>
                <div class="card"><div>ПЕСОК</div><div class="card-value" style="color:#f1c40f">${sand} вед.</div></div>
            `;
            
            if(mode === 'pgs' && r.g > 0) {
                 const pgs = ((parseFloat(sand) + parseFloat(grav)) * 0.9).toFixed(1);
                 html += `<div class="card"><div>ПЩС</div><div class="card-value" style="color:#1abc9c">${pgs} вед.</div></div>`;
            } else if (r.g > 0) {
                 html += `<div class="card"><div>ЩЕБЕНЬ</div><div class="card-value" style="color:#e67e22">${grav} вед.</div></div>`;
            }

            html += `
                <div class="card"><div>ВОДА</div><div class="card-value" style="color:#3498db">${water} вед.</div></div>
                <div class="card total-card"><div>ИТОГО</div><div class="card-value">${vol} л</div></div>
            `;
            document.getElementById('cards').innerHTML = html;
        }

        updateMixes();
    </script>
</body>
</html>
